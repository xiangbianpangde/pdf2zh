[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2zh-pipeline"
version = "0.2.0"
description = "英文 PDF → 中文 Markdown 交付管线：MinerU 云 OCR + OpenAI 兼容翻译"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "openai>=1.30",
    "markdown-it-py>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Web UI（Gradio）——只有 webui 入口需要
ui = ["gradio>=6.0", "gradio-client>=2.0"]
# 本机 mineru CLI（--ocr local）——会连带装 torch，Apple Silicon 上约 1.8 GB
local = ["mineru[all]>=3.1"]
all = ["pdf2zh-pipeline[ui,local]"]

[project.scripts]
pdf2zh-pipeline = "pdf2zh.cli:main"
pdf2zh-translate = "pdf2zh.core.translate:main"
pdf2zh-webui = "pdf2zh.webui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2zh = ["py.typed"]
