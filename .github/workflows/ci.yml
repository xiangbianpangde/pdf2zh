name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The suite only exercises the delivery contract (chunking, checkpoints,
      # image normalization, manifest/zip contents). MinerU, torch and gradio are
      # needed for a real local-OCR/UI run, not for these checks. Installing the
      # documented cloud requirement file keeps it from drifting away from the
      # imports the code actually needs.
      - name: Install test-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest

      - name: Run tests
        run: python -m pytest -q

      # Catches syntax/import-order regressions in modules the suite does not touch.
      - name: Byte-compile entry points
        run: |
          python -m py_compile \
            pdf_to_zh_md.py pdf_to_md.py pipeline.py config.py \
            translate_md.py mineru_api.py resource_contract.py \
            html_output.py app.py
