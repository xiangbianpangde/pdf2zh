name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The suite only exercises the delivery contract (chunking, checkpoints,
      # image normalization, manifest/zip contents). MinerU, torch and gradio are
      # needed for a real local-OCR/UI run, not for these checks. Installing the
      # documented cloud requirement file keeps it from drifting away from the
      # imports the code actually needs; pytest.ini supplies pythonpath=src.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest

      - name: Verify the package builds and its entry points import
        run: |
          python -m pip install -e .
          python -c "import pdf2zh, pdf2zh.cli, pdf2zh.core.pipeline, pdf2zh.core.translate; print(pdf2zh.PROJECT_ROOT)"

      # Catches syntax/import-order regressions in modules the suite does not touch.
      - name: Byte-compile every module
        run: python -m compileall -q src legacy scripts
